<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Magic Pro</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#fff; --soft:#f5f5f7; --card:#fff; --tx:#1d1d1f; --tx2:#6e6e73; --line:#e8e8ed;
  --ink:#1d1d1f; --ink-tx:#fff; --blue:#0071e3; --accent:#0071e3; --sale:#bf4800; --img:#f5f5f7;
  --shadow:0 4px 20px rgba(0,0,0,.06);
}
html.dark{
  --bg:#000; --soft:#1c1c1e; --card:#1c1c1e; --tx:#f5f5f7; --tx2:#98989d; --line:#2c2c2e;
  --ink:#f5f5f7; --ink-tx:#000; --blue:#2997ff; --accent:#2997ff; --sale:#ff9f0a; --img:#1c1c1e; --shadow:none;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Inter,Roboto,sans-serif;
  letter-spacing:-.016em;-webkit-font-smoothing:antialiased;padding-bottom:96px}
h1,h2,h3,.pr{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Inter,Roboto,sans-serif}
button{font:inherit;cursor:pointer;color:inherit}
svg{display:block}

/* ---- sarlavha ---- */
.top{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;padding:12px 20px 4px}
.top h1{text-align:center;font-size:19px;font-weight:700;letter-spacing:-.01em}
.ib{width:40px;height:40px;border:0;border-radius:50%;background:none;display:flex;align-items:center;justify-content:center;position:relative}
.badge{position:absolute;right:4px;top:4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--sale);color:#fff;font-size:10px;font-weight:700;display:none;align-items:center;justify-content:center}
.badge.on{display:flex}

/* ---- kategoriyalar ---- */
#cats{display:flex;gap:8px;overflow-x:auto;padding:14px 20px 4px;scrollbar-width:none}
#cats::-webkit-scrollbar{display:none}
.cat{flex:none;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;width:76px}
.cat .ci{width:48px;height:48px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--tx2);transition:.2s}
.cat span{font-size:11px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:76px}
.cat.on .ci{background:var(--ink);color:var(--ink-tx);box-shadow:0 0 0 3px var(--bg),0 0 0 4.5px var(--blue)}
.cat.on span{color:var(--tx);font-weight:600}

/* ---- qidiruv ---- */
.search{display:flex;align-items:center;gap:10px;margin:14px 20px 0;height:46px;padding:0 16px;border-radius:23px;background:var(--soft);color:var(--tx2)}
#q{flex:1;border:0;background:none;color:var(--tx);font:inherit;font-size:15px;outline:none;min-width:0}
#q::placeholder{color:var(--tx2)}

/* ---- banner ---- */
.hero{position:relative;margin:18px 20px 0;border-radius:16px;overflow:hidden;min-height:150px;padding:20px;display:flex;flex-direction:column;justify-content:center;
  background:radial-gradient(120% 140% at 90% 0%,#3a3a3c 0%,#1d1d1f 45%,#000 100%);color:#f5f5f7}
.hero img{width:170px;height:auto;margin-left:-6px}
.hero p{font-size:13px;opacity:.85;margin-top:6px;max-width:62%}
.hero .pill{align-self:flex-start;margin-top:12px;font-size:12px;font-weight:600;padding:7px 14px;border-radius:980px;background:var(--blue);color:#fff}
.hero .lap{position:absolute;right:-30px;bottom:-14px;width:170px;opacity:.9}

/* ---- bo'lim ---- */
.sec{display:flex;justify-content:space-between;align-items:baseline;padding:26px 20px 12px}
.sec h2{font-size:19px;font-weight:700;letter-spacing:-.01em}
.sec span{font-size:13px;color:var(--tx2)}

/* ---- kartochkalar ---- */
#grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 14px;padding:0 20px 20px}
@media (min-width:640px){#grid{grid-template-columns:repeat(3,1fr)}}
.card{display:flex;flex-direction:column;cursor:pointer}
.ph{position:relative;aspect-ratio:.82;border-radius:12px;background:var(--img);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--tx2)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph.stock{background:#f5f5f7}
.ph.stock img{object-fit:contain;padding:12%;mix-blend-mode:multiply}
.tag{position:absolute;left:8px;top:8px;font-size:10px;font-weight:700;padding:4px 8px;border-radius:10px;background:var(--bg);color:var(--sale)}
.add{position:absolute;right:8px;bottom:8px;width:32px;height:32px;border:0;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(0,0,0,.18);transition:transform .15s}
.add:active{transform:scale(.88)}
.add.in{background:var(--ink);color:var(--ink-tx)}
.nm{font-size:13px;font-weight:500;margin-top:10px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{font-size:15px;font-weight:700;margin-top:4px}
.pr small{font-size:12px;font-weight:500;color:var(--tx2);text-decoration:line-through;margin-left:6px}
.mo{font-size:11px;font-weight:600;color:var(--accent);margin-top:2px}
.msg{grid-column:1/-1;text-align:center;color:var(--tx2);padding:48px 0}
.sk .ph,.sk .l{background:linear-gradient(90deg,var(--img) 25%,var(--soft) 50%,var(--img) 75%);background-size:200% 100%;animation:sh 1.2s infinite}
.sk .l{height:11px;border-radius:6px;margin-top:9px}
@keyframes sh{to{background-position:-200% 0}}

/* ---- tovar sahifasi ---- */
.page{position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto;transform:translateY(100%);transition:transform .34s cubic-bezier(.2,.8,.2,1);padding-bottom:110px}
.page.open{transform:none}
.pv{position:relative;height:min(52vh,400px);background:var(--img);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--tx2)}
.pv::before{content:"";position:absolute;width:72%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.55)}
html.dark .pv::before{background:rgba(255,255,255,.04)}
.pv .gal{position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.pv .gal::-webkit-scrollbar{display:none}
.pv .gal img{flex:none;width:100%;height:100%;object-fit:cover;scroll-snap-align:center}
.pv.stock .gal img{object-fit:contain;padding:14% 10% 18%;mix-blend-mode:multiply}
.pv .ib{position:absolute;top:14px;z-index:2;background:var(--bg);box-shadow:var(--shadow)}
.dots{position:absolute;bottom:40px;left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:2}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(0,0,0,.18)}
.dots i.on{background:var(--tx)}
.demo{position:absolute;bottom:40px;left:0;right:0;text-align:center;font-size:11px;color:var(--tx2);z-index:2}
.body{position:relative;margin-top:-24px;background:var(--bg);border-radius:26px 26px 0 0;padding:26px 22px 0;box-shadow:0 -6px 20px rgba(0,0,0,.04)}
.hd{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.hd h3{font-size:20px;font-weight:700;line-height:1.25;letter-spacing:-.01em}
.hd .pr{font-size:22px;font-weight:800;margin:0;white-space:nowrap;text-align:right}
.hd .pr small{display:block;margin:0}
.uzs{font-size:14px;color:var(--tx2);margin-top:6px;font-weight:500}
.rate{font-size:11px;color:var(--tx2);margin-top:1px}
.qleft{font-size:12px;color:var(--sale);margin-top:6px;font-weight:600}
.blk{border-top:1px solid var(--line);margin-top:20px;padding-top:18px}
.blk h4{font-size:16px;font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;justify-content:space-between;gap:16px;padding:9px 0;font-size:14px}
.row span:first-child{color:var(--tx2)}
.row span:last-child{font-weight:600;text-align:right}
.mch{display:flex;gap:10px;flex-wrap:wrap}
.m{width:44px;height:44px;border:0;border-radius:50%;background:var(--soft);color:var(--tx2);font-size:14px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.m small{font-size:9px;font-weight:500;margin-top:2px}
.m.on{background:var(--blue);color:#fff}
.pl{display:flex;justify-content:space-between;padding-top:12px;font-size:14px}
.pl span{color:var(--tx2)}
.pl b{font-weight:700}
.pl.hi b{font-size:18px;color:var(--accent)}
.soon{display:flex;gap:12px;align-items:flex-start;background:var(--soft);border-radius:14px;padding:14px}
.soon-i{flex:none;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;background:linear-gradient(135deg,#0071e3,#5ac8fa)}
.soon b{display:block;font-size:14px}
.soon span{display:block;color:var(--tx2);font-size:12px;margin-top:2px;line-height:1.4}
.pnote{color:var(--tx2);font-size:12px;margin-top:12px;line-height:1.4}

/* ---- savat ---- */
.ct{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;padding:14px 16px 6px}
.ct h3{text-align:center;font-size:18px;font-weight:700}
.items{padding:10px 20px 0;display:flex;flex-direction:column;gap:14px}
.ci2{display:flex;background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--line)}
.th{flex:none;width:96px;position:relative;background:var(--img);display:flex;align-items:center;justify-content:center;color:var(--tx2)}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.th.stock img{object-fit:contain;padding:10%;mix-blend-mode:multiply}
.th svg{width:34px;height:34px}
.ci2 .in{flex:1;padding:12px 12px 12px 14px;min-width:0}
.ci2 .t{display:flex;justify-content:space-between;gap:8px}
.ci2 .t b{font-size:14px;font-weight:700;line-height:1.3}
.rm{flex:none;border:0;background:none;color:var(--tx2);width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.ci2 .p{font-size:16px;font-weight:800;margin-top:6px}
.ci2 .s{font-size:11px;color:var(--tx2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum{margin:22px 0 0;padding:6px 20px 0;border-radius:26px 26px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.05);background:var(--bg)}
.sr{display:flex;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--line);font-size:14px}
.sr span{color:var(--tx2)}
.sr.big{border:0;font-size:15px}
.sr.big b{font-size:20px;font-weight:800}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--soft);border-radius:23px;padding:4px;margin-bottom:14px}
.seg button{border:0;border-radius:19px;padding:9px;background:none;font-size:13px;font-weight:600;color:var(--tx2)}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.tel{width:100%;border:1px solid var(--line);border-radius:23px;padding:13px 18px;background:var(--bg);color:var(--tx);font:inherit;outline:none;margin-top:18px}
.tel:focus{border-color:var(--blue)}
.note{color:var(--tx2);font-size:12px;margin-top:10px;text-align:center}
#fab{position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:20;border:0;border-radius:980px;padding:16px;background:var(--blue);color:#fff;box-shadow:0 8px 24px rgba(0,113,227,.3);
  font-weight:700;font-size:16px;display:none;align-items:center;justify-content:center;gap:10px}
</style>
</head>
<body>
<div class="top">
  <span></span>
  <h1>Magic Pro</h1>
  <button class="ib" id="cartBtn" aria-label="Savat">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
    <span class="badge" id="badge"></span>
  </button>
</div>
<div id="cats"></div>
<label class="search">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
  <input id="q" type="search" placeholder="Qidirish: Air M1, 16/512..." autocomplete="off">
</label>
<div class="hero">
  <img src="logo.png" alt="Magic Pro" width="170" height="62">
  <p id="sub">MacBooklar · narxlar real vaqtda</p>
  <span class="pill" id="heroPill">Bo'lib to'lash · 8 oygacha</span>
</div>
<div class="sec"><h2 id="secTitle">Barcha mahsulotlar</h2><span id="secCount"></span></div>
<main id="grid"></main>

<div class="page" id="page"></div>
<button id="fab"></button>

<script>
const tg = window.Telegram && Telegram.WebApp;
const inTg = !!(tg && tg.initData);
const dark = tg && tg.colorScheme ? tg.colorScheme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
if (dark) document.documentElement.classList.add("dark");
const C = dark ? {bg:"#000000", ink:"#2997ff", inkTx:"#ffffff"} : {bg:"#ffffff", ink:"#0071e3", inkTx:"#ffffff"};
if (tg) {
  tg.ready(); tg.expand();
  try { tg.setHeaderColor(C.bg); tg.setBackgroundColor(C.bg); tg.MainButton.setParams({color: C.ink, text_color: C.inkTx}); } catch (e) {}
}

let items = [], cat = "Hammasi", view = null, curId = null;
let plan = {down: 50, min: 3, max: 8, pct: 6}, usdUzs = null, rateDate = "", itemM = 8, payM = 0;
const cart = new Set();
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const byId = id => items.find(i => i.id === id);
const cost = i => i.promo || i.price;
const sp3 = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
const ICON = `<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/></svg>`;
const I = {
  back: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>`,
  plus: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`,
  check: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>`,
  x: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`,
  all: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>`,
  mac: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="4.5" y="5" width="15" height="10.5" rx="1.5"/><path d="M2.5 18.5h19"/></svg>`,
  phone: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="7" y="3" width="10" height="18" rx="2.5"/><path d="M11 18h2"/></svg>`,
  tab: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="3.5" width="16" height="17" rx="2.5"/><path d="M11 17.5h2"/></svg>`,
  acc: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg>`,
  watch: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="6.5" y="6" width="11" height="12" rx="3"/><path d="M9 6l.5-3h5l.5 3M9 18l.5 3h5l.5-3"/></svg>`,
  bag: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>`,
};
function catIcon(n) {
  n = n.toLowerCase();
  if (n === "hammasi") return I.all;
  if (/mac|air|pro|noutbuk|laptop/.test(n)) return I.mac;
  if (/iphone|phone|telefon/.test(n)) return I.phone;
  if (/ipad|plansh/.test(n)) return I.tab;
  if (/watch|soat/.test(n)) return I.watch;
  return I.acc;
}

function money(v, c) {
  v = Math.round(v * 100) / 100;
  const [a, b] = (Number.isInteger(v) ? String(v) : v.toFixed(2)).split(".");
  const n = sp3(a) + (b ? "." + b : "");
  return (!c || /usd|\$/i.test(c)) ? "$" + n : n + " so'm";
}
function totalStr(list) { return sumBy(list, cost); }
function sumBy(list, f) {
  const t = {};
  list.forEach(i => t[i.currency] = (t[i.currency] || 0) + f(i));
  return Object.entries(t).map(([c, v]) => money(v, c)).join(" + ");
}
function calc(price, m) {
  const down = Math.ceil(price * plan.down / 100);
  const rest = Math.round((price - down) * (1 + plan.pct / 100 * m) * 100) / 100;
  const monthly = Math.ceil(rest * 100 / m - 1e-9) / 100;
  return {down, monthly, total: Math.round((down + rest) * 100) / 100};
}
function months() { const a = []; for (let m = plan.min; m <= plan.max; m++) a.push(m); return a; }
function uzs(i) {
  if (!usdUzs || !/usd|\$/i.test(i.currency || "USD")) return "";
  const v = Math.round(cost(i) * usdUzs / 1000) * 1000;
  return `<div class="uzs">≈ ${sp3(v)} so'm</div>
    <div class="rate">Kurs: 1$ = ${sp3(usdUzs)} so'm${rateDate ? " · " + esc(rateDate) : ""}</div>`;
}
function pics(i) { return i.photos.length ? {list: i.photos, stock: false} : {list: i.stock || [], stock: true}; }
function imgTag(list) {
  if (!list.length) return ICON;
  return `<img src="${esc(list[0])}" data-alt="${esc(list.slice(1).join("|"))}" onerror="nextImg(this)" loading="lazy" alt="">`;
}
window.nextImg = function (el) {
  const rest = (el.dataset.alt || "").split("|").filter(Boolean);
  if (rest.length) { el.dataset.alt = rest.slice(1).join("|"); el.src = rest[0]; }
  else { const p = el.closest(".stock"); p && p.classList.remove("stock"); el.outerHTML = ICON; }
};
function specs(i) { return i.details.slice(0, 3).map(d => d[1]).join(" · "); }
function haptic(t) { try { tg.HapticFeedback.impactOccurred(t || "light"); } catch (e) {} }

/* ---- asosiy tugma ---- */
let mainHandler = () => {};
function setMain(text, onClick) {
  if (inTg) {
    tg.MainButton.offClick(mainHandler);
    mainHandler = onClick || (() => {});
    if (text) { tg.MainButton.setText(text); tg.MainButton.show(); tg.MainButton.onClick(mainHandler); }
    else tg.MainButton.hide();
  } else {
    const b = $("#fab");
    b.innerHTML = text ? I.bag + esc(text) : ""; b.style.display = text ? "flex" : "none"; b.onclick = onClick;
  }
}
function refreshMain() {
  const n = cart.size;
  $("#badge").textContent = n; $("#badge").classList.toggle("on", n > 0);
  if (view === "cart") return setMain("Buyurtma berish", submit);
  if (view === "item") {
    const inC = cart.has(curId);
    return setMain(inC ? "Savatga o'tish" : "Savatga qo'shish", () => {
      if (cart.has(curId)) return openCart();
      cart.add(curId); haptic("medium"); render(); refreshMain();
    });
  }
  const list = [...cart].map(byId).filter(Boolean);
  setMain(list.length ? `Savat · ${list.length} ta · ${totalStr(list)}` : "", openCart);
}

/* ---- bosh sahifa ---- */
function renderCats() {
  const names = ["Hammasi", ...new Set(items.map(i => i.category))];
  $("#cats").innerHTML = names.map(n => `<button class="cat ${n === cat ? "on" : ""}" data-c="${esc(n)}">
    <div class="ci">${catIcon(n)}</div><span>${esc(n)}</span></button>`).join("");
}
function render() {
  const q = $("#q").value.trim().toLowerCase();
  const list = items.filter(i =>
    (cat === "Hammasi" || i.category === cat) &&
    (!q || (i.name + " " + i.brand + " " + i.details.map(d => d.join(" ")).join(" ")).toLowerCase().includes(q)));
  $("#secTitle").textContent = cat === "Hammasi" ? "Barcha mahsulotlar" : cat;
  $("#secCount").textContent = list.length ? `${list.length} ta` : "";
  $("#grid").innerHTML = list.length ? list.map(i => {
    const P = pics(i);
    return `<div class="card" data-id="${esc(i.id)}">
      <div class="ph ${P.stock && P.list.length ? "stock" : ""}">
        ${imgTag(P.list)}
        ${i.promo ? `<span class="tag">Aksiya</span>` : (i.qty !== null && i.qty <= 2 ? `<span class="tag">${i.qty} ta qoldi</span>` : "")}
        <button class="add ${cart.has(i.id) ? "in" : ""}" data-add="${esc(i.id)}" aria-label="Savatga">${cart.has(i.id) ? I.check : I.plus}</button>
      </div>
      <div class="nm">${esc(i.name)}</div>
      <div class="pr">${money(cost(i), i.currency)}${i.promo ? `<small>${money(i.price, i.currency)}</small>` : ""}</div>
      ${i.mac ? `<div class="mo">oyiga ${money(calc(cost(i), plan.max).monthly, i.currency)} dan</div>` : ""}
    </div>`;
  }).join("") : `<div class="msg">Hech narsa topilmadi</div>`;
}
function skeleton() {
  $("#grid").innerHTML = Array(4).fill(`<div class="card sk"><div class="ph"></div><div class="l"></div><div class="l" style="width:50%"></div></div>`).join("");
}
function toggle(id) {
  cart.has(id) ? cart.delete(id) : cart.add(id);
  haptic(); render(); refreshMain();
}

/* ---- sahifalar ---- */
function openPage(html, v) {
  view = v; $("#page").innerHTML = html; $("#page").scrollTop = 0; $("#page").classList.add("open");
  if (inTg) tg.BackButton.show();
}
function closePage() {
  view = null; curId = null; $("#page").classList.remove("open");
  if (inTg) tg.BackButton.hide();
  render(); refreshMain();
}
const SOON = `<div class="soon"><div class="soon-i">✨</div><div><b>Bo'lib to'lash tez orada</b>
  <span>Hozircha muddatli to'lov faqat MacBooklar uchun. Bu mahsulotga ham yaqinda qo'shamiz.</span></div></div>`;
function itemPlan(i) {
  if (!i.mac) return SOON;
  const c = calc(cost(i), itemM), cur = i.currency;
  return `<div class="mch">${months().map(m => `<button class="m ${m === itemM ? "on" : ""}" data-im="${m}">${m}<small>oy</small></button>`).join("")}</div>
    <div class="pl" style="padding-top:16px"><span>Boshlang'ich to'lov (${plan.down}%)</span><b>${money(c.down, cur)}</b></div>
    <div class="pl hi"><span>Oyiga · ${itemM} oy</span><b>${money(c.monthly, cur)}</b></div>
    ${plan.pct ? `<div class="pl"><span>Jami</span><b>${money(c.total, cur)}</b></div>` : ""}`;
}
function openItem(id) {
  const i = byId(id); if (!i) return;
  curId = id;
  const P = pics(i);
  const multi = !P.stock && P.list.length > 1;
  openPage(`
    <div class="pv ${P.stock && P.list.length ? "stock" : ""}">
      <button class="ib" data-close style="left:16px" aria-label="Orqaga">${I.back}</button>
      ${P.list.length ? `<div class="gal" id="gal">${P.stock ? imgTag(P.list) : P.list.map(u => `<img src="${esc(u)}" alt="">`).join("")}</div>` : ICON}
      ${multi ? `<div class="dots">${P.list.map((_, k) => `<i class="${k ? "" : "on"}"></i>`).join("")}</div>` : ""}
      ${P.stock && P.list.length ? `<div class="demo">Namunaviy rasm · haqiqiy holatini menejerdan so'rang</div>` : ""}
    </div>
    <div class="body">
      <div class="hd">
        <h3>${esc(i.name)}</h3>
        <div class="pr">${money(cost(i), i.currency)}${i.promo ? `<small>${money(i.price, i.currency)}</small>` : ""}</div>
      </div>
      ${uzs(i)}
      ${i.qty !== null && i.qty <= 2 ? `<div class="qleft">Atigi ${i.qty} ta qoldi</div>` : ""}
      <div class="blk"><h4>Bo'lib to'lash</h4><div id="iplan" data-id="${esc(i.id)}">${itemPlan(i)}</div></div>
      <div class="blk"><h4>Xususiyatlari</h4>
        ${i.brand ? `<div class="row"><span>Brend</span><span>${esc(i.brand)}</span></div>` : ""}
        ${i.details.map(d => `<div class="row"><span>${esc(d[0])}</span><span>${esc(d[1])}</span></div>`).join("")}
        ${i.qty !== null ? `<div class="row"><span>Mavjud</span><span>${i.qty} ta</span></div>` : ""}
      </div>
    </div>`, "item");
  const g = $("#gal");
  if (g && multi) g.addEventListener("scroll", () => {
    const k = Math.round(g.scrollLeft / g.clientWidth);
    document.querySelectorAll(".dots i").forEach((d, n) => d.classList.toggle("on", n === k));
  }, {passive: true});
  refreshMain();
}
function cartPlan(list) {
  const macs = list.filter(i => i.mac), other = list.filter(i => !i.mac);
  if (!macs.length) { payM = 0; return SOON; }
  let h = `<div class="seg">
    <button class="${payM ? "" : "on"}" data-pm="0">To'liq to'lash</button>
    <button class="${payM ? "on" : ""}" data-pm="${payM || plan.max}">Bo'lib to'lash</button></div>`;
  if (payM) {
    h += `<div class="mch">${months().map(m => `<button class="m ${m === payM ? "on" : ""}" data-pm="${m}">${m}<small>oy</small></button>`).join("")}</div>
      <div class="pl" style="padding-top:16px"><span>Boshlang'ich to'lov${other.length ? "" : ` (${plan.down}%)`}</span><b>${sumBy(list, i => i.mac ? calc(cost(i), payM).down : cost(i))}</b></div>
      <div class="pl hi"><span>Oyiga · ${payM} oy</span><b>${sumBy(macs, i => calc(cost(i), payM).monthly)}</b></div>
      ${plan.pct ? `<div class="pl"><span>Bo'lib to'lashda jami</span><b>${sumBy(list, i => i.mac ? calc(cost(i), payM).total : cost(i))}</b></div>` : ""}
      ${other.length ? `<div class="pnote">✨ Muddatli to'lov faqat MacBooklarga. Boshqa mahsulotlar boshlang'ich to'lov bilan birga to'liq to'lanadi.</div>` : ""}`;
  }
  return h;
}
function openCart() {
  const list = [...cart].map(byId).filter(Boolean);
  if (!list.length) { if (view) closePage(); return; }
  const tel = $("#tel") ? $("#tel").value : "";
  openPage(`
    <div class="ct"><button class="ib" data-close aria-label="Orqaga">${I.back}</button><h3>Savatingiz</h3><span></span></div>
    <div class="items">${list.map(i => { const P = pics(i); return `<div class="ci2">
      <div class="th ${P.stock && P.list.length ? "stock" : ""}">${imgTag(P.list)}</div>
      <div class="in"><div class="t"><b>${esc(i.name)}</b><button class="rm" data-rm="${esc(i.id)}" aria-label="O'chirish">${I.x}</button></div>
        <div class="p">${money(cost(i), i.currency)}</div><div class="s">${esc(specs(i))}</div></div></div>`; }).join("")}</div>
    <div class="sum">
      <div class="sr big"><span style="color:var(--tx)">Jami · ${list.length} ta mahsulot</span><b>${totalStr(list)}</b></div>
      <div class="blk" style="margin-top:4px"><h4>To'lov turi</h4><div id="cplan">${cartPlan(list)}</div></div>
      <input class="tel" id="tel" type="tel" inputmode="tel" placeholder="Telefon raqamingiz: +998 ..." autocomplete="tel" value="${esc(tel)}">
      <div class="note">Menejerimiz siz bilan bog'lanib, buyurtmani tasdiqlaydi.</div>
    </div>`, "cart");
  refreshMain();
}

async function submit() {
  const phone = ($("#tel")?.value || "").trim();
  if (phone.replace(/\D/g, "").length < 9) {
    const msg = "Iltimos, telefon raqamingizni yozing";
    inTg ? tg.showAlert(msg) : alert(msg); return;
  }
  if (!inTg) { alert("Buyurtma faqat Telegram ichida yuboriladi"); return; }
  tg.MainButton.showProgress();
  try {
    const r = await fetch("api/order", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({initData: tg.initData, items: [...cart], phone, months: payM})});
    const d = await r.json();
    if (!d.ok) throw new Error(d.error);
    cart.clear(); payM = 0; closePage();
    tg.HapticFeedback.notificationOccurred("success");
    tg.showAlert("Rahmat! Buyurtmangiz qabul qilindi. Menejerimiz tez orada bog'lanadi.");
  } catch (e) {
    tg.showAlert("Yuborib bo'lmadi, birozdan keyin qayta urinib ko'ring.");
  } finally { tg.MainButton.hideProgress(); }
}

/* ---- hodisalar ---- */
$("#q").addEventListener("input", render);
$("#cartBtn").addEventListener("click", openCart);
$("#cats").addEventListener("click", e => {
  const c = e.target.closest("[data-c]"); if (!c) return;
  cat = c.dataset.c; haptic("soft"); renderCats(); render();
});
$("#grid").addEventListener("click", e => {
  const a = e.target.closest("[data-add]");
  if (a) { e.stopPropagation(); return toggle(a.dataset.add); }
  const card = e.target.closest(".card"); if (card && card.dataset.id) openItem(card.dataset.id);
});
$("#page").addEventListener("click", e => {
  if (e.target.closest("[data-close]")) return closePage();
  const im = e.target.closest("[data-im]");
  if (im) { itemM = +im.dataset.im; haptic("soft"); $("#iplan").innerHTML = itemPlan(byId($("#iplan").dataset.id)); return; }
  const pm = e.target.closest("[data-pm]");
  if (pm) { payM = +pm.dataset.pm; haptic("soft"); $("#cplan").innerHTML = cartPlan([...cart].map(byId).filter(Boolean)); return; }
  const rm = e.target.closest("[data-rm]");
  if (rm) { cart.delete(rm.dataset.rm); haptic(); render(); openCart(); }
});
if (inTg) tg.BackButton.onClick(closePage);

skeleton();
fetch("api/products").then(r => r.json()).then(d => {
  items = d.items || [];
  if (d.plan) { plan = d.plan; itemM = plan.max; $("#heroPill").textContent = `Bo'lib to'lash · ${plan.max} oygacha`; }
  usdUzs = d.usd_uzs || null; rateDate = d.rate_date || "";
  $("#sub").textContent = items.length ? `${items.length} ta model · narxlar real vaqtda` : "Hozircha tovar yo'q";
  renderCats(); render(); refreshMain();
}).catch(() => { $("#grid").innerHTML = `<div class="msg">Yuklab bo'lmadi. Qayta oching.</div>`; });
</script>
</body>
</html>
