<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>MagicPro</title>
<script>
/* Kirish animatsiyasi: birinchi marta to'liq, keyin 6 soatda bir marta qisqa varianti */
(function () {
  var mode = "";
  try {
    if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var seen = localStorage.getItem("mp_intro2"), t = +localStorage.getItem("mp_intro2_t") || 0;
    if (!seen) mode = "full"; else if (Date.now() - t > 6 * 3600e3) mode = "short";
    if (mode) { localStorage.setItem("mp_intro2", "1"); localStorage.setItem("mp_intro2_t", String(Date.now())); }
  } catch (e) { mode = "short"; }
  if (mode) document.documentElement.setAttribute("data-intro", mode);
})();
</script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&family=Unbounded:wght@500..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --s1:#141416; --s2:#1c1c1e; --line:rgba(255,255,255,.08); --edge:rgba(255,255,255,.07);
  --tx:#fff; --tx2:#98989d; --ok:#7ee0a6; --mid:#ffc266; --low:#ff8a80; --sale:#ff9466; --img:#f5f5f7;
  --gloss:linear-gradient(180deg,#fff 0%,#f4f4f7 44%,#9e9ea6 53%,#e6e6ec 80%,#fff 100%);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#000}
body{color:var(--tx);font:15px/1.45 Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;padding-bottom:96px;overflow-x:hidden}
html[data-intro] body>*:not(.xin){visibility:hidden}
html[data-intro=full],html[data-intro=full] body{background:#fff}
.xin{position:fixed;inset:0;z-index:100;background:#000;cursor:pointer}
html[data-intro=full] .xin{background:#fff}
.xin canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.xin.out{transition:opacity .25s;opacity:0 !important}
.xskip{position:absolute;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));font:600 13px/1 Inter,system-ui,sans-serif;color:rgba(140,140,146,.9)}
button{font:inherit;cursor:pointer;color:inherit;border:0;background:none}
svg{display:block}
.disp{font-family:Unbounded,"Arial Black",-apple-system,sans-serif}
.gl{-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;background-image:var(--gloss)}

/* ---- sarlavha va qidiruv ---- */
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 0}
.logo{height:36px;width:auto;display:block}
.ib{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:rgba(255,255,255,.06);
  display:flex;align-items:center;justify-content:center;position:relative;color:#fff}
.badge{position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#fff;color:#000;
  font-size:11px;font-weight:800;border:2px solid #000;display:none;align-items:center;justify-content:center}
.badge.on{display:flex}
.search{display:flex;align-items:center;gap:10px;margin:12px 16px 0;height:46px;padding:0 16px;border-radius:23px;
  background:var(--s1);border:1px solid var(--line);color:var(--tx2)}
#q{flex:1;border:0;background:none;color:#fff;font:inherit;font-size:15px;outline:none;min-width:0}
#q::placeholder{color:#8e8e93}

/* ---- haftaning taklifi ---- */
.hero{position:relative;margin:14px 16px 0;height:300px;border-radius:26px;overflow:hidden;border:1px solid rgba(255,255,255,.09);
  background:#141416;touch-action:pan-y}
.hero[hidden]{display:none}
.slide{position:absolute;inset:0;padding:52px 18px 18px;opacity:0;pointer-events:none;transition:opacity .45s;cursor:pointer}
.slide.on{opacity:1;pointer-events:auto}
.slide::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 90% at var(--gx,90%) var(--gy,45%),rgba(255,255,255,.11),rgba(20,20,22,0) 65%)}
.hw{position:absolute;right:14px;top:84px;width:146px;height:146px}
.hph{width:146px;height:146px;border-radius:24px;overflow:hidden;background:var(--s2);display:flex;align-items:center;justify-content:center;
  color:var(--tx2);box-shadow:0 22px 40px rgba(0,0,0,.65);position:relative}
.hph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hph.stock{background:var(--img)}
.hph.stock img{object-fit:contain;padding:12%;mix-blend-mode:multiply}
.htx{position:relative;max-width:52%;display:flex;flex-direction:column;align-items:flex-start}
.chip{height:26px;padding:0 10px;border-radius:13px;background:rgba(255,255,255,.14);color:#ebebf0;font-size:12px;font-weight:650;
  display:flex;align-items:center;gap:6px;white-space:nowrap}
.htx h2{margin-top:10px;font-size:18px;line-height:23px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.htx p{margin-top:4px;font-size:12.5px;line-height:18px;color:var(--tx2)}
.hp{margin-top:8px;display:flex;align-items:baseline;gap:8px}
.hp .disp{font-size:27px;line-height:34px;font-weight:700}
.hp s{font-size:13px;color:var(--tx2)}
.hm{font-size:12.5px;line-height:16px;font-weight:600;color:#fff}
.cta{margin-top:12px;height:44px;padding:0 18px;border-radius:22px;background:#fff;color:#000;font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.shim{background-image:linear-gradient(105deg,rgba(255,255,255,0) 40%,rgba(255,255,255,.95) 50%,rgba(255,255,255,0) 60%),var(--gloss);
  background-size:250% 100%,100% 100%;background-repeat:no-repeat;background-position:180% 0,0 0}
.slide.on .hw{animation:mIn .8s cubic-bezier(.2,.8,.2,1) both}
.slide.on .hph{animation:fl 3.2s ease-in-out .8s infinite}
.slide.on .a1{animation:up .5s .05s both}.slide.on .a2{animation:up .5s .12s both}
.slide.on .a3{animation:up .5s .2s both}.slide.on .a4{animation:up .5s .28s both}
.slide.on .shim{animation:shn 3s ease-in-out .6s infinite}
.hbars{position:absolute;left:12px;right:12px;top:0;display:flex;gap:5px;z-index:2}
.hb{flex:1;height:44px;padding-top:14px}
.hb span{display:block;height:3px;border-radius:2px;background:rgba(255,255,255,.22);overflow:hidden}
.hb i{display:block;height:100%;background:#fff;transform:scaleX(0);transform-origin:left center}
.hb.done i{transform:scaleX(1)}
.hb.on i{animation:run 4.5s linear both}
@keyframes mIn{from{opacity:0;transform:translateX(50px) rotate(4deg) scale(.94)}to{opacity:1;transform:translateX(0) rotate(-3deg) scale(1)}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes shn{0%{background-position:180% 0,0 0}45%,100%{background-position:-80% 0,0 0}}
@keyframes run{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* ---- va'dalar va kategoriyalar ---- */
.pp{margin:14px 16px 0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pp div{height:44px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);display:flex;align-items:center;
  justify-content:center;gap:7px;font-size:12.5px;font-weight:600;color:#ebebf0;white-space:nowrap}
#cats{display:flex;gap:8px;overflow-x:auto;padding:22px 16px 2px;scrollbar-width:none}
#cats::-webkit-scrollbar{display:none}
.cat{flex:none;width:84px;height:84px;border-radius:18px;border:1px solid var(--line);background:var(--s1);color:#ebebf0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:0 6px}
.cat span{font-size:12px;font-weight:600;line-height:1.2;text-align:center;max-width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cat.on{background:#fff;border-color:#fff;color:#000}
.sec{display:flex;justify-content:space-between;align-items:center;padding:24px 16px 12px}
.sec h2{font-size:17px;line-height:22px;font-weight:600}
.sec span{font-size:13px;color:var(--tx2)}

/* ---- kartochkalar ---- */
#grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0 16px 20px}
@media (min-width:640px){#grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{background:var(--s1);border:1px solid var(--edge);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer}
.ph{position:relative;height:150px;background:radial-gradient(60% 70% at 50% 45%,rgba(255,255,255,.07),rgba(20,20,22,0) 70%),var(--s2);
  display:flex;align-items:center;justify-content:center;color:var(--tx2);overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph.stock{background:var(--img)}
.ph.stock img{object-fit:contain;padding:14%;mix-blend-mode:multiply}
.gr{position:absolute;top:10px;left:10px;width:32px;height:32px;border-radius:11px;font:700 14px/32px Unbounded,"Arial Black",sans-serif;text-align:center;z-index:1}
.gA{background:#fff;color:#000}
.gB,.gC,.gD{background:rgba(28,28,30,.88);color:#fff;border:1px solid rgba(255,255,255,.28);line-height:30px}
.gC,.gD{color:#c7c7cc;border-color:rgba(255,255,255,.18)}
.tag{position:absolute;left:10px;bottom:12px;height:24px;padding:0 9px;border-radius:12px;font-size:11.5px;font-weight:650;background:rgba(0,0,0,.78);
  border:1px solid rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;z-index:1}
.tag.sale{background:var(--sale);border-color:var(--sale);color:#2a1206}
.add{position:absolute;right:8px;bottom:8px;width:44px;height:44px;border-radius:22px;background:#fff;color:#000;display:flex;align-items:center;
  justify-content:center;z-index:1;box-shadow:0 4px 14px rgba(0,0,0,.45);transition:transform .15s}
.add:active{transform:scale(.88)}
.add.in{background:rgba(0,0,0,.72);color:#fff;border:1.5px solid #fff}
.info{padding:12px 12px 14px;display:flex;flex-direction:column;flex:1}
.nm{font-size:14.5px;line-height:19px;font-weight:600;min-height:38px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sp{margin-top:2px;font-size:12.5px;line-height:18px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt{margin-top:9px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;height:18px;color:var(--tx2)}
.bar{width:36px;height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;flex:none}
.bar i{display:block;height:100%;border-radius:3px;background:currentColor}
.ok{color:var(--ok)}.mid{color:var(--mid)}.low{color:var(--low)}
.wr{display:flex;align-items:center;gap:3px;color:var(--tx2)}
.pr{margin-top:auto;padding-top:10px;font:700 18px/24px Unbounded,"Arial Black",sans-serif;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.pr s{font:500 12px Inter,sans-serif;color:var(--tx2);-webkit-text-fill-color:var(--tx2)}
.pr.sale{color:#ffaf8a}
.mo{font-size:12px;line-height:17px;color:#fff;font-weight:600;margin-top:1px}
.msg{grid-column:1/-1;text-align:center;color:var(--tx2);padding:48px 0}
.sk .ph,.sk .l{background:linear-gradient(90deg,#141416 25%,#222225 50%,#141416 75%);background-size:200% 100%;animation:sk 1.2s infinite}
.sk .l{height:11px;border-radius:6px;margin:12px 12px 0}
.sk .l.s{width:50%;margin-bottom:16px}
@keyframes sk{to{background-position:-200% 0}}

/* ---- tovar sahifasi ---- */
.page{position:fixed;inset:0;z-index:10;background:#000;overflow-y:auto;transform:translateY(100%);visibility:hidden;
  transition:transform .34s cubic-bezier(.2,.8,.2,1),visibility 0s .34s;padding-bottom:110px}
.page.open{transform:none;visibility:visible;transition:transform .34s cubic-bezier(.2,.8,.2,1)}
.pv{position:relative;height:min(48vh,380px);background:radial-gradient(55% 55% at 50% 50%,rgba(255,255,255,.1),rgba(0,0,0,0) 72%),#0a0a0a;
  display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--tx2)}
.pv .gal{position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.pv .gal::-webkit-scrollbar{display:none}
.pv .gal img{flex:none;width:100%;height:100%;object-fit:cover;scroll-snap-align:center}
.pv.stock .gal{inset:22px 22px 40px;border-radius:24px;background:var(--img)}
.pv.stock .gal img{object-fit:contain;padding:10%;mix-blend-mode:multiply}
.pb{position:absolute;top:16px;height:30px;padding:0 11px;border-radius:15px;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.14);
  font-size:12.5px;font-weight:650;display:flex;align-items:center;gap:6px;z-index:2;color:#fff}
.pb.l{left:16px}.pb.r{right:16px}
.hasback .pb.l{left:70px}
.pv .ib{position:absolute;left:16px;top:10px;z-index:3;background:rgba(0,0,0,.72)}
.dots{position:absolute;bottom:16px;left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:2}
.dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.25);transition:width .2s}
.dots i.on{width:18px;background:#fff}
.body{padding:0 16px}
.ttl{margin-top:18px;font-size:21px;line-height:27px;font-weight:600}
.subt{margin-top:4px;font-size:15px;line-height:22px;color:var(--tx2)}
.box{background:var(--s1);border:1px solid var(--edge);border-radius:22px;margin-top:12px;padding:16px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.h4{font:600 15px/22px Unbounded,"Arial Black",sans-serif}
.hint{font-size:13px;color:var(--tx2)}
.lbl{font-size:12.5px;line-height:18px;color:var(--tx2)}
.big{font-size:25px;line-height:32px;font-weight:700}
.old{font-size:13px;color:var(--tx2);text-decoration:line-through;margin-top:2px}
.hr{height:1px;background:rgba(255,255,255,.08);margin:12px 0}
.mrow b{font-size:15px;line-height:22px;font-weight:650}
.mchip{height:26px;padding:0 10px;border-radius:13px;background:rgba(255,255,255,.14);color:#ebebf0;font-size:12px;font-weight:650;display:flex;align-items:center;white-space:nowrap}
.rate{margin-top:6px;font-size:12.5px;line-height:18px;color:var(--tx2)}
.qleft{margin-top:8px;font-size:12.5px;font-weight:650;color:var(--sale)}
.gauges{margin-top:12px;display:grid;grid-template-columns:repeat(var(--c,3),minmax(0,1fr));gap:8px}
.gauge{background:var(--s1);border:1px solid var(--edge);border-radius:20px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;text-align:center}
.gv{width:56px;height:56px;border-radius:28px;display:flex;align-items:center;justify-content:center;position:relative;flex:none}
.gv.L{font:700 26px/1 Unbounded,"Arial Black",sans-serif;background:rgba(255,255,255,.14);color:#fff}
.gv.LA{background:#fff;color:#000}
.gv.S{background:rgba(255,255,255,.12);color:#fff}
.gv svg.ring{position:absolute;inset:0;transform:rotate(-90deg)}
.gv b{position:relative;font-size:13px;font-weight:750}
.g1{margin-top:10px;font-size:13px;line-height:18px;font-weight:650}
.gs{font-size:11.5px;line-height:16px;color:var(--tx2)}
.meter{margin-top:14px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.meter div{display:flex;flex-direction:column;gap:6px}
.meter i{height:8px;border-radius:4px;background:rgba(255,255,255,.12)}
.meter i.on{background:#fff}
.meter span{font-size:11.5px;line-height:16px;color:var(--tx2)}
.meter span.on{color:#fff;font-weight:700}
.gtext{margin-top:12px;font-size:14px;line-height:21px;color:#d1d1d6}
.mch{margin-top:14px;display:grid;grid-template-columns:repeat(var(--n,6),minmax(0,1fr));gap:6px}
.m{height:48px;border-radius:14px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.05);color:#ebebf0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.m b{font-size:16px;line-height:18px}
.m small{font-size:11px;line-height:13px;color:var(--tx2)}
.m.on{background:#fff;border-color:#fff;color:#000}
.m.on small{color:#3a3a3c}
.monthly{margin-top:16px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.monthly .disp{font-size:24px;line-height:30px;font-weight:700}
.monthly span:last-child{font-size:13px;color:var(--tx2)}
.pl{margin-top:10px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14px}
.pl span{color:var(--tx2)}
.pl b{font-weight:650;text-align:right}
.pnote{margin-top:10px;font-size:12.5px;line-height:18px;color:var(--tx2)}
.soon{display:flex;gap:12px;align-items:flex-start}
.soon b{display:block;font-size:14px}
.soon span{display:block;color:var(--tx2);font-size:12.5px;margin-top:2px;line-height:1.45}
.row{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:14px;line-height:20px}
.row:last-child{border-bottom:0}
.row span:first-child{color:var(--tx2)}
.row span:last-child{font-weight:600;text-align:right}
.prm{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.prm:last-child{border-bottom:0}
.pri{width:40px;height:40px;flex:none;border-radius:13px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center}
.prm b{display:block;font-size:14px;line-height:20px;font-weight:650}
.prm span{display:block;font-size:12.5px;line-height:18px;color:var(--tx2)}
.ask{width:100%;margin-top:12px;height:50px;border-radius:16px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);
  color:#fff;font-weight:650;display:flex;align-items:center;justify-content:center;gap:8px}

/* ---- savat ---- */
.ct{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:14px 16px 6px}
.ct h3{text-align:center;font:600 17px/1.3 Unbounded,"Arial Black",sans-serif}
.items{padding:10px 16px 0;display:flex;flex-direction:column;gap:12px}
.ci2{display:flex;background:var(--s1);border:1px solid var(--edge);border-radius:18px;overflow:hidden}
.th{flex:none;width:96px;min-height:96px;position:relative;background:var(--s2);display:flex;align-items:center;justify-content:center;color:var(--tx2)}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.th.stock{background:var(--img)}
.th.stock img{object-fit:contain;padding:10%;mix-blend-mode:multiply}
.th svg{width:34px;height:34px}
.ci2 .in{flex:1;padding:12px 12px 12px 14px;min-width:0}
.ci2 .t{display:flex;justify-content:space-between;gap:8px}
.ci2 .t b{font-size:14px;font-weight:650;line-height:1.3}
.rm{flex:none;width:36px;height:36px;margin:-8px -8px 0 0;color:var(--tx2);display:flex;align-items:center;justify-content:center}
.ci2 .p{font:700 15px/1.3 Unbounded,"Arial Black",sans-serif;margin-top:6px}
.ci2 .s{font-size:11.5px;color:var(--tx2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum{padding:6px 16px 0}
.sr{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:16px 0 4px;font-size:14px}
.sr b{font:700 19px/1.3 Unbounded,"Arial Black",sans-serif}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--s2);border-radius:23px;padding:4px;margin-top:12px}
.seg button{border-radius:19px;padding:10px;font-size:13px;font-weight:600;color:var(--tx2)}
.seg button.on{background:#fff;color:#000}
.phb{width:100%;margin-top:16px;border-radius:16px;padding:14px 18px;background:var(--s2);color:#fff;font-weight:600;font-size:15px;
  display:flex;align-items:center;justify-content:center;gap:8px}
.phb svg{width:20px;height:20px}
.pho{margin-top:16px;border:1px solid var(--line);border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:10px}
.pho svg{flex:none;width:20px;height:20px;color:var(--ok)}
.pho b{font-size:15px}
.pho span{font-size:12px;color:var(--tx2);display:block}

<script>

  mouse: `<svg width="24" height="24" viewBox="0 0 24 24" ${S} stroke-width="1.8"><rect x="7" y="3" width="10" height="18" rx="5"/><path d="M12 7v3"/></svg>`,
  plug: `<svg width="24" height="24" viewBox="0 0 24 24" ${S} stroke-width="1.8"><path d="M9 3v4M15 3v4M7 7h10v3a5 5 0 0 1-10 0V7zM12 15v6"/></svg>`,
  bagC: `<svg width="24" height="24" viewBox="0 0 24 24" ${S} stroke-width="1.8"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>`,
  tag: `<svg width="24" height="24" viewBox="0 0 24 24" ${S} stroke-width="1.8"><path d="M3 12V4h8l10 10-8 8L3 12z"/><circle cx="7.5" cy="8.5" r="1.3"/></svg>`,
  watch: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6.5" y="6" width="11" height="12" rx="3"/><path d="M9 6l.5-3h5l.5 3M9 18l.5 3h5l.5-3"/></svg>`,
  bag: `<svg width="18" height="18" viewBox="0 0 24 24" ${S} stroke-width="1.9"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>`,
};
const CAT_ICONS = [
  [/\bvr\b|virtual|vision pro|oculus|quest/, "vr"],
  [/ko.?zoynak|glasses|ochki|очки|ray.?ban/, "glasses"],
  [/airpods|quloqchin|naushnik|наушник|headphone|earbud|garnitura|гарнитур|audio/, "head"],
  [/smartfon|smartphone|iphone|phone|telefon|телефон|samsung|xiaomi|pixel/, "phone"],
  [/ipad|plansh|tablet|планшет/, "tab"],
  [/watch|soat|часы/, "watch"],
  [/macbook|noutbuk|laptop|ноутбук|\bmba\b|\bmbp\b/, "mac"],
  [/imac|monitor|displey|монитор|\btv\b|televizor/, "monitor"],
  [/playstation|\bps[45]\b|konsol|консол|xbox|nintendo|gamepad|joystick|o.?yin/, "game"],
  [/kamera|camera|камера|gopro|dron|drone/, "cam"],
  [/kolonka|колонк|speaker|homepod|jbl|marshall/, "speaker"],
  [/klaviatura|keyboard|клавиатур/, "kbd"],
  [/mouse|sichqon|мыш|trackpad/, "mouse"],
  [/sumka|r[yu]?u?kzak|рюкзак|сумк|bag|chexol|чехол|case/, "bagC"],
  [/zaryad|kabel|adapter|charger|power ?bank|зарядк|кабел|magsafe/, "plug"],
  [/aksessuar|аксессуар|accessor/, "plug"],
];
function catIcon(n) {
  n = n.toLowerCase();
  if (n === "hammasi") return I.all;
  for (const [rx, k] of CAT_ICONS) if (rx.test(n)) return I[k];
  return I.tag;
}
/* Billz'dagi xato yozuvlarni Mini App'da to'g'rilab ko'rsatish */
const fixWords = s => s.replace(/\brguzak\b/gi, "ryukzak").replace(/\brukzak\b/gi, "ryukzak");
const catLabel = n => fixWords(n.split(/\s*[>\/]\s*/).filter(Boolean).pop() || n);

function money(v, c) {
  v = Math.round(v * 100) / 100;
  const [a, b] = (Number.isInteger(v) ? String(v) : v.toFixed(2)).split(".");
  const n = sp3(a) + (b ? "." + b : "");
  return (!c || /usd|\$/i.test(c)) ? "$" + n : n + " so'm";
}
/* Tovar ichida narx so'mda (kurs bo'lsa), ro'yxatda esa dollarda */
const somOK = i => !!(usdUzs && isUsd(i));
function som(i, v) { return somOK(i) ? sp3(Math.round(v * usdUzs / 1000) * 1000) + " so'm" : money(v, i.currency); }
function totalStr(list) { return sumBy(list, cost); }
function sumBy(list, f) {
  const t = {};
  list.forEach(i => t[i.currency] = (t[i.currency] || 0) + f(i));
  return Object.entries(t).map(([c, v]) => money(v, c)).join(" + ");
}
function calc(price, m) {
  const down = Math.ceil(price * plan.down / 100);
  const markup = price * plan.pct / 100 * m;       // har oy umumiy narxning pct% i
  const rest = Math.round(((price - down) + markup) * 100) / 100;
  const monthly = Math.ceil(rest * 100 / m - 1e-9) / 100;
  return {down, monthly, total: Math.round((down + rest) * 100) / 100};
}
/* Ro'yxatdagi "oyiga ... dan" — butun songa yaxlitlab (yuqoriga) */
function perMonth(i) {
  const v = calc(cost(i), plan.max).monthly;
  return isUsd(i) ? money(Math.ceil(v), i.currency) : money(Math.ceil(v / 1000) * 1000, i.currency);
}
function months() { const a = []; for (let m = plan.min; m <= plan.max; m++) a.push(m); return a; }
function pics(i) {
  if (i.photos.length) return {list: i.photos, stock: false};                      // tovarning o'z rasmi (Billz)
  if (i.mphotos && i.mphotos.length) return {list: i.mphotos, stock: false, model: true};  // model rasmi (admin panel)
  return {list: i.stock || [], stock: true};                                        // Apple namunaviy rasmi
}
function imgTag(list) {
  if (!list.length) return ICON;
  return `<img src="${esc(list[0])}" data-alt="${esc(list.slice(1).join("|"))}" onerror="nextImg(this)" loading="lazy" alt="">`;
}
window.nextImg = function (el) {
  const rest = (el.dataset.alt || "").split("|").filter(Boolean);
  if (rest.length) { el.dataset.alt = rest.slice(1).join("|"); el.src = rest[0]; }
  else { const p = el.closest(".stock"); p && p.classList.remove("stock"); el.outerHTML = ICON; }
};

/* ---- Billz xarakteristikalaridan ma'lumot ---- */
function det(i, rx) { for (const [k, v] of i.details) if (rx.test(String(k).toLowerCase())) return String(v); return ""; }
const GRADE = {
  A: ["A'lo", "Ehtiyotkor ishlatilgan: korpus va ekranda iz yo'q, hamma qismi joyida."],
  B: ["Yaxshi", "Yaxshi saqlangan: mayda, deyarli sezilmaydigan izlar bor, hammasi ishlaydi."],
  C: ["O'rtacha", "Ko'rinadigan izlar bor, lekin hamma qismi to'liq ishlaydi."],
  D: ["Arzon", "Korpusda sezilarli izlar bor, ishlashi joyida. Eng arzon variant."],
};
const LEVEL = {D: 1, C: 2, B: 3, A: 4};
function grade(i) {
  for (const [k, v] of i.details) {
    if (!/daraja|holat|grade|sinf|состоян|класс|condition/.test(String(k).toLowerCase())) continue;
    const s = String(v).trim(), m = s.match(/^([abcd])(\b|$)/i) || s.match(/\b([abcd])\b/i);
    if (m) return m[1].toUpperCase();
  }
  return "";
}
function battery(i) {
  let b = null, c = null;
  for (const [k, v] of i.details) {
    const key = String(k).toLowerCase();
    if (b === null && /batar|battery|акб|батар|health|sog'?liq/.test(key)) { const m = String(v).match(/\d{2,3}/); if (m) b = Math.min(+m[0], 100); }
    if (c === null && /sikl|cycle|цикл/.test(key)) { const m = String(v).match(/\d+/); if (m) c = +m[0]; }
  }
  return {b, c};
}
const bcls = b => b === null ? "" : b >= 90 ? "ok" : b >= 80 ? "mid" : "low";
/* Kafolat: Apple M chipli MacBook — 3 oy, Intel — 1 oy */
function warranty(i) {
  if (!i.mac) return 0;
  const t = (i.name + " " + i.details.map(d => d.join(" ")).join(" ")).toLowerCase();
  if (/\bm[1-9]\b|apple m\d|\bm[1-9] ?(pro|max|ultra)\b/.test(t)) return 3;
  if (/intel|core ?i[3579]|\bi[3579]\b/.test(t)) return 1;
  const y = t.match(/\b(20[12]\d)\b/);
  if (y) return +y[1] >= 2021 ? 3 : +y[1] <= 2019 ? 1 : 0;
  return 0;
}
function shortSpec(i) {
  const num = s => (String(s).match(/\d+/) || [""])[0];
  const ram = num(det(i, /\bram\b|ozu|operativ|memory|озу|оператив/));
  const ssd = num(det(i, /ssd|storage|disk|hdd|накоп|ichki|xotira/));
  const color = det(i, /rang|color|цвет/);
  const parts = [];
  if (ram && ssd && ram !== ssd) parts.push(`${ram}/${ssd} GB`); else if (ssd || ram) parts.push(`${ssd || ram} GB`);
  if (color) parts.push(color);
  return parts.length ? parts.join(" · ") : i.details.slice(0, 3).map(d => d[1]).join(" · ");
}
function haptic(t) { try { tg.HapticFeedback.impactOccurred(t || "light"); } catch (e) {} }

/* ---- Telegram tugmalari ---- */
let mainHandler = () => {};
function setMain(text, onClick) {
  if (inTg) {
    tg.MainButton.offClick(mainHandler);
    mainHandler = onClick || (() => {});
    if (text) { tg.MainButton.setText(text); tg.MainButton.show(); tg.MainButton.onClick(mainHandler); }
    else tg.MainButton.hide();
  } else {
    const b = $("#fab");
    b.innerHTML = text ? I.bag + esc(text) : ""; b.style.display = text ? "flex" : "none"; b.onclick = onClick;
  }
}
function askManager() {
  const u = "https://t.me/" + (contact || "sherxonjumayev");
  try { inTg ? tg.openTelegramLink(u) : window.open(u, "_blank"); } catch (e) { location.href = u; }
}
function setSecondary(show) {
  if (!hasSecondary) return;
  try {
    if (show) tg.SecondaryButton.setParams({text: "Savol berish", color: "#1C1C1E", text_color: "#FFFFFF", position: "left", is_visible: true});
    else tg.SecondaryButton.hide();
  } catch (e) {}
}
if (hasSecondary) tg.SecondaryButton.onClick(askManager);
function refreshMain() {
  const n = cart.size;
  $("#badge").textContent = n; $("#badge").classList.toggle("on", n > 0);
  setSecondary(view === "item");
  if (view === "cart") return setMain("Buyurtma berish", submit);
  if (view === "item") {
    const inC = cart.has(curId);
    return setMain(inC ? "Savatga o'tish" : "Savatga qo'shish", () => {
      if (cart.has(curId)) return openCart();
      cart.add(curId); haptic("medium"); render(); refreshMain();
    });
  }
  const list = [...cart].map(byId).filter(Boolean);
  setMain(list.length ? `Savat · ${list.length} ta · ${totalStr(list)}` : "", openCart);
}

/* ---- Haftaning taklifi: eng arzon 3 ta MacBook ---- */
let hero = [], hi = 0, hTimer = null;
const usdOf = i => isUsd(i) ? cost(i) : cost(i) / (usdUzs || 12000);
function pickHero() { return items.filter(i => i.mac).sort((a, b) => usdOf(a) - usdOf(b)).slice(0, 3); }
const GLOW = [[90, 45], [80, 30], [95, 65]];
function heroSlide(i, k, n) {
  const P = pics(i), g = grade(i), B = battery(i);
  const sub = [g ? GRADE[g][0] + " holat" : "", B.b !== null ? `batareya ${B.b}%` : shortSpec(i)].filter(Boolean).join(" · ");
  return `<div class="slide ${k === hi ? "on" : ""}" style="--gx:${GLOW[k % 3][0]}%;--gy:${GLOW[k % 3][1]}%" data-open="${esc(i.id)}">
    <div class="hw"><div class="hph ${P.stock && P.list.length ? "stock" : ""}">${imgTag(P.list)}</div></div>
    <div class="htx">
      <span class="chip a1">${I.spark}Haftaning taklifi${n > 1 ? ` · ${k + 1}/${n}` : ""}</span>

function introColor(c) {
  if (!tg) return;
  try { tg.setHeaderColor(c); tg.setBackgroundColor(c); } catch (e) {}
  try { tg.setBottomBarColor && tg.setBottomBarColor(c); } catch (e) {}
}
function intro() {
  const mode = document.documentElement.getAttribute("data-intro");
  if (!mode) return;
  const START = mode === "full" ? 0 : 2.1;               // qisqa variant: MacBook ochilishidan boshlanadi
  const HOLD = .3, FADE = .35;
  let raf = 0, finished = false;
  const ov = document.createElement("div");
  ov.className = "xin";
  ov.innerHTML = `<canvas aria-hidden="true"></canvas><span class="xskip">O'tkazib yuborish</span>`;
  document.body.appendChild(ov);
  const done = () => {
    if (finished) return; finished = true;
    cancelAnimationFrame(raf); clearTimeout(giveUp);
    document.documentElement.removeAttribute("data-intro"); ov.remove(); introColor("#000000");
    if (hero.length && !view) setHero(0);
  };
  const giveUp = setTimeout(done, 3500);                 // internet sekin bo'lsa — animatsiyasiz ochiladi
  ov.addEventListener("click", () => { ov.classList.add("out"); haptic("light"); setTimeout(done, 260); }, {once: true});
  new Promise((res, rej) => { const sc = document.createElement("script"); sc.src = "intro/intro.js?v=2"; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc); })
    .then(() => Promise.race([MPIntro.loadFonts("intro/"), new Promise(r => setTimeout(r, 2500))]))
    .then(() => {
      if (finished) return;
      clearTimeout(giveUp);
      const A = MPIntro.create(ov.querySelector("canvas"));
      addEventListener("resize", A.resize);
      const t0 = performance.now(); let white = null;
      const tick = now => {
        if (finished) return;
        const t = START + (now - t0) / 1000, end = MPIntro.T_END + HOLD;
        A.seek(Math.min(t, MPIntro.T_END));
        const w = t < .95; if (w !== white) { white = w; introColor(w ? "#FFFFFF" : "#000000"); }
        if (t > end) ov.style.opacity = String(Math.max(0, 1 - (t - end) / FADE));
        if (t > end + FADE) return done();
        raf = requestAnimationFrame(tick);
      };
      raf = requestAnimationFrame(tick);
    }).catch(done);
}
