<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Uzmacbook</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#fff);
  --bg2:var(--tg-theme-secondary-bg-color,#f2f2f7);
  --card:var(--tg-theme-section-bg-color,var(--tg-theme-bg-color,#fff));
  --tx:var(--tg-theme-text-color,#111);
  --hint:var(--tg-theme-hint-color,#8e8e93);
  --acc:var(--tg-theme-button-color,#2481cc);
  --acctx:var(--tg-theme-button-text-color,#fff);
  --red:var(--tg-theme-destructive-text-color,#e53935);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg2);color:var(--tx);font:15px/1.35 -apple-system,system-ui,Roboto,sans-serif;padding-bottom:90px}
header{position:sticky;top:0;z-index:5;background:var(--bg2);padding:10px 12px 4px}
.brand{font-weight:700;font-size:18px;margin-bottom:8px}
#q{width:100%;border:0;border-radius:12px;padding:10px 12px;background:var(--card);color:var(--tx);font-size:15px;outline:none}
#q::placeholder{color:var(--hint)}
#cats{display:flex;gap:8px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}
#cats::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:16px;padding:6px 12px;background:var(--card);color:var(--tx);font-size:13px}
.chip.on{background:var(--acc);color:var(--acctx)}
#grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:6px 12px}
.card{background:var(--card);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:1;background:var(--bg2) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--hint);font-size:36px}
.cb{padding:8px 10px 10px;display:flex;flex-direction:column;gap:4px;flex:1}
.nm{font-weight:600;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sp{color:var(--hint);font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{font-weight:700;margin-top:auto;padding-top:2px}
.old{color:var(--hint);text-decoration:line-through;font-weight:400;font-size:12px;margin-left:4px}
.left{color:var(--red);font-size:12px}
.add{border:0;border-radius:10px;padding:8px;background:var(--acc);color:var(--acctx);font-weight:600;font-size:13px;margin-top:4px}
.add.in{background:var(--bg2);color:var(--acc)}
.msg{grid-column:1/-1;text-align:center;color:var(--hint);padding:48px 0}
.sheet{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.45);display:none;align-items:flex-end}
.sheet.open{display:flex}
.panel{background:var(--bg);width:100%;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:14px 14px 28px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.x{border:0;background:var(--bg2);color:var(--tx);width:32px;height:32px;border-radius:50%;font-size:16px}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:8px;margin:0 -14px 12px;padding:0 14px;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal img{flex:none;width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;scroll-snap-align:center;background:var(--bg2)}
h2{font-size:18px}
.big{font-size:20px;font-weight:700;margin:6px 0}
table{width:100%;border-collapse:collapse;margin:8px 0 14px;font-size:14px}
td{padding:8px 0;border-bottom:1px solid var(--bg2);vertical-align:top}
td:first-child{color:var(--hint);width:45%;padding-right:8px}
.wide{width:100%;padding:13px;font-size:15px;border-radius:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bg2)}
.row b{white-space:nowrap}
.rm{border:0;background:none;color:var(--red);font-size:13px;margin-top:2px}
.tot{display:flex;justify-content:space-between;font-weight:700;padding:12px 0}
.tel{width:100%;border:0;border-radius:12px;padding:12px;background:var(--bg2);color:var(--tx);font-size:16px;outline:none;margin:6px 0}
.note{color:var(--hint);font-size:13px}
#fab{position:fixed;left:12px;right:12px;bottom:14px;z-index:20;border:0;border-radius:12px;padding:14px;background:var(--acc);color:var(--acctx);font-weight:600;font-size:15px;display:none}
</style>
</head>
<body>
<header>
  <div class="brand">Uzmacbook · MagicPro</div>
  <input id="q" type="search" placeholder="Qidirish: Air M1, 16/512..." autocomplete="off">
  <div id="cats"></div>
</header>
<main id="grid"><div class="msg">Yuklanmoqda...</div></main>

<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
<button id="fab"></button>

<script>
const tg = window.Telegram && Telegram.WebApp;
const inTg = !!(tg && tg.initData);
if (tg) { tg.ready(); tg.expand(); }

let items = [], cat = "Hammasi", view = null; // view: null | "item" | "cart"
const cart = new Set();
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const byId = id => items.find(i => i.id === id);
const cost = i => i.promo || i.price;

function money(v, c) {
  const n = Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  return (!c || /usd|\$/i.test(c)) ? n + " $" : n + " so'm";
}
function totalStr(list) {
  const t = {};
  list.forEach(i => t[i.currency] = (t[i.currency] || 0) + cost(i));
  return Object.entries(t).map(([c, v]) => money(v, c)).join(" + ");
}
function specs(i) { return i.details.slice(0, 4).map(d => d[1]).join(" · "); }
function haptic() { try { tg.HapticFeedback.impactOccurred("light"); } catch (e) {} }

/* ---- asosiy tugma (Telegram MainButton yoki brauzerda oddiy tugma) ---- */
function setMain(text, onClick) {
  if (inTg) {
    tg.MainButton.offClick(mainHandler);
    mainHandler = onClick;
    if (text) { tg.MainButton.setText(text); tg.MainButton.show(); tg.MainButton.onClick(mainHandler); }
    else tg.MainButton.hide();
  } else {
    const b = $("#fab");
    b.textContent = text || ""; b.style.display = text ? "block" : "none"; b.onclick = onClick;
  }
}
let mainHandler = () => {};
function refreshMain() {
  if (view === "cart") return setMain("Buyurtma berish", submit);
  if (view === "item") return;
  const list = [...cart].map(byId).filter(Boolean);
  setMain(list.length ? `Savat: ${list.length} ta · ${totalStr(list)}` : "", openCart);
}

/* ---- ro'yxat ---- */
function renderCats() {
  const names = ["Hammasi", ...new Set(items.map(i => i.category))];
  $("#cats").innerHTML = names.map(n => `<button class="chip ${n === cat ? "on" : ""}" data-c="${esc(n)}">${esc(n)}</button>`).join("");
}
function render() {
  const q = $("#q").value.trim().toLowerCase();
  const list = items.filter(i =>
    (cat === "Hammasi" || i.category === cat) &&
    (!q || (i.name + " " + i.brand + " " + i.details.map(d => d.join(" ")).join(" ")).toLowerCase().includes(q)));
  $("#grid").innerHTML = list.length ? list.map(i => `
    <div class="card" data-id="${esc(i.id)}">
      <div class="ph" ${i.photos[0] ? `style="background-image:url('${esc(i.photos[0])}')"` : ""}>${i.photos[0] ? "" : "💻"}</div>
      <div class="cb">
        <div class="nm">${esc(i.name)}</div>
        <div class="sp">${esc(specs(i))}</div>
        <div class="pr">${money(cost(i), i.currency)}${i.promo ? `<span class="old">${money(i.price, i.currency)}</span>` : ""}</div>
        ${i.qty !== null && i.qty <= 2 ? `<div class="left">Atigi ${i.qty} ta qoldi</div>` : ""}
        <button class="add ${cart.has(i.id) ? "in" : ""}" data-add="${esc(i.id)}">${cart.has(i.id) ? "Savatda ✓" : "Savatga"}</button>
      </div>
    </div>`).join("") : `<div class="msg">Hech narsa topilmadi</div>`;
}
function toggle(id) {
  cart.has(id) ? cart.delete(id) : cart.add(id);
  haptic(); render(); refreshMain();
}

/* ---- oynalar ---- */
function openSheet(html, v) {
  view = v; $("#panel").innerHTML = html; $("#sheet").classList.add("open");
  if (inTg) tg.BackButton.show();
}
function closeSheet() {
  view = null; $("#sheet").classList.remove("open");
  if (inTg) tg.BackButton.hide();
  refreshMain();
}
function openItem(id) {
  const i = byId(id); if (!i) return;
  const gal = i.photos.length ? `<div class="gal">${i.photos.map(u => `<img src="${esc(u)}" loading="lazy" alt="">`).join("")}</div>` : "";
  openSheet(`
    <div class="top"><h2>${esc(i.name)}</h2><button class="x" data-close>✕</button></div>
    ${gal}
    <div class="big">${money(cost(i), i.currency)}${i.promo ? `<span class="old">${money(i.price, i.currency)}</span>` : ""}</div>
    <table>
      ${i.brand ? `<tr><td>Brend</td><td>${esc(i.brand)}</td></tr>` : ""}
      ${i.details.map(d => `<tr><td>${esc(d[0])}</td><td>${esc(d[1])}</td></tr>`).join("")}
      ${i.qty !== null ? `<tr><td>Mavjud</td><td>${i.qty} ta</td></tr>` : ""}
    </table>
    <button class="add wide ${cart.has(i.id) ? "in" : ""}" data-add="${esc(i.id)}" data-stay>${cart.has(i.id) ? "Savatdan olib tashlash" : "Savatga qo'shish"}</button>`, "item");
  setMain("", null);
}
function openCart() {
  const list = [...cart].map(byId).filter(Boolean);
  if (!list.length) return;
  openSheet(`
    <div class="top"><h2>Savat</h2><button class="x" data-close>✕</button></div>
    ${list.map(i => `<div class="row"><div>${esc(i.name)}<br><button class="rm" data-rm="${esc(i.id)}">O'chirish</button></div><b>${money(cost(i), i.currency)}</b></div>`).join("")}
    <div class="tot"><span>Jami</span><span>${totalStr(list)}</span></div>
    <input class="tel" id="tel" type="tel" inputmode="tel" placeholder="Telefon raqamingiz: +998 ..." autocomplete="tel">
    <div class="note">Menejerimiz siz bilan bog'lanib, buyurtmani tasdiqlaydi.</div>`, "cart");
  refreshMain();
}

async function submit() {
  const phone = ($("#tel")?.value || "").trim();
  if (phone.replace(/\D/g, "").length < 9) {
    const msg = "Iltimos, telefon raqamingizni yozing";
    inTg ? tg.showAlert(msg) : alert(msg); return;
  }
  if (!inTg) { alert("Buyurtma faqat Telegram ichida yuboriladi"); return; }
  tg.MainButton.showProgress();
  try {
    const r = await fetch("api/order", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({initData: tg.initData, items: [...cart], phone})});
    const d = await r.json();
    if (!d.ok) throw new Error(d.error);
    cart.clear(); closeSheet(); render();
    tg.HapticFeedback.notificationOccurred("success");
    tg.showAlert("Rahmat! Buyurtmangiz qabul qilindi. Menejerimiz tez orada bog'lanadi.");
  } catch (e) {
    tg.showAlert("Yuborib bo'lmadi, birozdan keyin qayta urinib ko'ring.");
  } finally { tg.MainButton.hideProgress(); }
}

/* ---- hodisalar ---- */
$("#q").addEventListener("input", render);
$("#cats").addEventListener("click", e => {
  const c = e.target.closest("[data-c]"); if (!c) return;
  cat = c.dataset.c; renderCats(); render();
});
$("#grid").addEventListener("click", e => {
  const a = e.target.closest("[data-add]");
  if (a) return toggle(a.dataset.add);
  const card = e.target.closest(".card"); if (card) openItem(card.dataset.id);
});
$("#sheet").addEventListener("click", e => {
  if (e.target.id === "sheet" || e.target.closest("[data-close]")) return closeSheet();
  const a = e.target.closest("[data-add]");
  if (a) { toggle(a.dataset.add); return openItem(a.dataset.add); }
  const rm = e.target.closest("[data-rm]");
  if (rm) { cart.delete(rm.dataset.rm); render(); cart.size ? openCart() : closeSheet(); }
});
if (inTg) tg.BackButton.onClick(closeSheet);

fetch("api/products").then(r => r.json()).then(d => {
  items = d.items || []; renderCats(); render(); refreshMain();
}).catch(() => { $("#grid").innerHTML = `<div class="msg">Yuklab bo'lmadi, qayta oching</div>`; });
</script>
</body>
</html>
